{%extends "base.html" %}
{% block title %}Task{% endblock %}

{% block content %}
<div class="task-box">
    <h2>Your Task</h2>
    <form action="{{url_for('tasks.add_tasks')}}" method="POST" class="task-form">
        <input type="text" name="title" placeholder="New task" required>
        <button type="submit" class="btn">Add</button>
    </form>

        {% if tasks %}
    
    <table class="task-table">
        <thead>
            <tr>
                <th>#</th>
                <th>Task</th>
                <th>Stuatus</th>
                <th>Change</th>
                <th>Clear Task</th>
            </tr>
        </thead>

        <tbody>
            {% for task in tasks %}
            <tr>
                <td>{{loop.index}}</td>
                <td>{{task.title}}</td>
                <td>
                    <span class="badge {{task.status|lower}}">{{task.status}}</span>
                </td>
                <td>
                    <form action="{{url_for('tasks.change_status',task_id=task.id)}}" method="POST">
                        <button class="btn-small" type="submit">Next</button>
                    </form>
                </td>
                <td>
                    <form action="{{url_for('tasks.clear_tasks',task_id=task.id)}}" method="POST">
                        <button class="btn-small" type="submit">Dlete</button>
                    </form>
                </td>
              
            </tr>
            {% endfor %}
        </tbody>

    </table>
        <form action="{{url_for('tasks.clear_all')}}" method="POST">
            <button class="btn-clear" type="submit">Clear All Tasks</button>
        </form>
        {% else %}
        <p>No tasks yet. Add one above!</p>
        {% endif %}

</div>
{% endblock %}
